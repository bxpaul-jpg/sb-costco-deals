<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB 카트</title>
<meta name="description" content="유리카트 최신 영상 기준 코스트코 행사 상품">
<meta name="theme-color" content="#ce4539">
<link rel="icon" href="assets/sb_logo.png">
<link rel="apple-touch-icon" href="assets/sb_logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --sb:#ce4539;--sb-deep:#a8321f;--sb-soft:#fbe9e5;
  --bg:#f4f3ef;--surface:#ffffff;--surface-2:#efede7;--ink:#17171a;--ink-2:#55555c;--ink-3:#8b8b92;--line:#e4e2dc;
  --shadow:0 1px 2px rgba(20,20,20,.06),0 6px 20px rgba(20,20,20,.06);
  --radius:18px;--font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sb-soft:#3a1d17;--bg:#111113;--surface:#1c1c1f;--surface-2:#26262a;--ink:#f2f2f0;--ink-2:#b8b8bd;--ink-3:#808087;--line:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--sb-soft:#3a1d17;--bg:#111113;--surface:#1c1c1f;--surface-2:#26262a;--ink:#f2f2f0;--ink-2:#b8b8bd;--ink-3:#808087;--line:#2e2e33;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- 잠금 화면 ---------- */
.gate{display:none}
body.locked .gate{display:flex;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(120% 80% at 50% 0%,var(--sb-soft),var(--bg) 60%)}
body.locked .app{display:none}
.gate form{width:100%;max-width:360px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:32px 24px;display:flex;flex-direction:column;gap:14px}
.gate img{height:40px;align-self:flex-start}
.gate h1{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.gate p{margin:0;color:var(--ink-2);font-size:14px}
.gate input[type=password]{font-size:20px;letter-spacing:.3em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);outline:none}
.gate input[type=password]:focus{border-color:var(--sb)}
.gate label{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.gate button{font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--sb);color:#fff;cursor:pointer;font-size:16px}
.gate button:disabled{opacity:.6}
#gate-msg{min-height:1.4em;color:var(--sb);font-size:13px;text-align:center}

/* ---------- 상단 ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:12px}
.bar img{height:26px}
.bar .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bar .t b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.bar .t span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--sb);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.icon-btn .dot[hidden]{display:none}
.icon-btn[aria-pressed="true"]{background:var(--sb);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;height:44px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.search select{border:0;background:transparent;font-size:13px;color:var(--ink-2);outline:none;cursor:pointer;max-width:120px}
.views{display:flex;background:var(--surface);border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.views button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--sb);color:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-padding:16px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.cat small{font-weight:500;color:var(--ink-3);margin-left:3px;font-size:12px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.cat[aria-pressed="true"] small{color:inherit;opacity:.7}
.cat.flt[aria-pressed="true"]{background:var(--sb);color:#fff}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

main{max-width:1240px;margin:0 auto;padding:8px 16px 64px}
h2{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}

/* ---------- SB PICK 캐러셀 ---------- */
.picks{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,300px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 14px;scroll-padding:16px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{scroll-snap-align:start;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;border:0;padding:0;text-align:left}
.pick .ph{aspect-ratio:4/3}
.pick .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.pick .nm{font-weight:700;font-size:15.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.pick .pr{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.pick .pr b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.pick .pr s{color:var(--ink-3);font-size:13px}
.pick .rank{position:absolute;left:12px;bottom:10px;font-size:44px;font-weight:900;color:#fff;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.35);letter-spacing:-.05em}

/* ---------- 사진 영역 ---------- */
.ph{position:relative;background:#fff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;padding:8%}
.ph.none{display:grid;place-items:center;background:var(--ph-bg,#eee)}
.ph.none .mono{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ph-ink,#999)}
.ph.none .mono img{width:34%;max-width:90px;padding:0;opacity:.28;filter:grayscale(1)}
.ph.none .mono span{font-size:12px;font-weight:600;opacity:.8}
.off{position:absolute;left:10px;top:10px;background:var(--sb);color:#fff;font-weight:800;border-radius:10px;padding:4px 8px;font-size:14px;letter-spacing:-.02em;box-shadow:0 2px 8px rgba(206,69,57,.35)}
.off.won{background:var(--ink);box-shadow:none;font-size:12.5px}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:#9a9aa0;backdrop-filter:blur(6px)}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"]{color:var(--sb)}
.heart[aria-pressed="true"] svg{fill:currentColor}

/* ---------- 상품 그리드 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.98)}
@media (hover:hover){.card:hover{transform:translateY(-2px)}}
.card .ph{aspect-ratio:1/1}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .nm{font-weight:650;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .sp{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{margin-top:6px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card .pr b{font-size:18px;font-weight:800;letter-spacing:-.03em}
.card .pr s{font-size:12px;color:var(--ink-3)}
.card .ft{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2)}
.tag.hot{background:var(--sb-soft);color:var(--sb)}
.tag.again{background:#e8f0ff;color:#2457c5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.again{background:#1b2740;color:#8fb2ff}}
.unit{font-size:11px;color:var(--ink-3)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:11.5px;color:#55555c;background:rgba(255,255,255,.85);text-align:center}
.ours{margin-top:6px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ours i{font-style:normal;color:var(--ink-3)}
.tag.down{background:#e3f5ea;color:#167a3e}
.tag.up{background:var(--surface-2);color:var(--ink-3)}
.tag.warn{background:#fff3d6;color:#8a5a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.down{background:#16301f;color:#6fd394}:root:not([data-theme="light"]) .tag.warn{background:#3a2c0c;color:#f0c36a}}
.buy{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.buy h4{margin:0;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.buy .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.buy .kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.buy .kv span{display:block;font-size:11.5px;color:var(--ink-3)}
.buy .kv b{font-size:15px}
.buy table{width:100%;border-collapse:collapse;font-size:12.5px}
.buy th{text-align:left;font-weight:600;color:var(--ink-3);padding:4px 0;border-bottom:1px solid var(--line)}
.buy td{padding:5px 0;border-bottom:1px solid var(--line)}
.buy td:not(:first-child),.buy th:not(:first-child){text-align:right}
.buy .cmp{font-size:13px;font-weight:600}
.trend{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.trend h4{margin:0 0 4px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.trend h4 small{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.trend svg{width:100%;height:auto;display:block;overflow:visible}
.trend .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.trend .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.trend .note{font-size:11.5px;color:var(--ink-3);margin-top:6px}

.empty{padding:48px 16px;text-align:center;color:var(--ink-3)}
.sentinel{height:1px}
.foot{margin-top:40px;font-size:12.5px;color:var(--ink-3);line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
.foot p{margin:0 0 6px}
.foot button{margin-top:8px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}

/* ---------- 상세 시트 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(720px,92vw);border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .lay{display:grid;grid-template-columns:1fr 1fr}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
@media (min-width:760px){.sheet .grab{display:none}}
.sheet .x{position:absolute;right:12px;top:12px;z-index:2}
.sheet .ph{aspect-ratio:4/3;margin:12px;border-radius:18px}
.sheet .ph.none{aspect-ratio:16/7}
@media (min-width:760px){.sheet .ph,.sheet .ph.none{aspect-ratio:1/1}}
.sheet .info{padding:6px 20px 22px;display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.sheet .info{padding:28px 24px 24px 8px}}
.sheet .cat-l{font-size:12.5px;color:var(--sb);font-weight:700}
.sheet h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sheet .spec{color:var(--ink-2);font-size:13.5px}
.no{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border:0;border-radius:8px;padding:4px 8px;cursor:pointer;align-self:flex-start}
.prices{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.prices dt{color:var(--ink-2)}
.prices dd{margin:0;text-align:right;font-weight:600}
.prices .big dt{align-self:center;font-weight:700;color:var(--ink)}
.prices .big dd{font-size:26px;font-weight:850;color:var(--sb);letter-spacing:-.03em}
.prices .row{display:contents}
.period{font-size:13px;color:var(--ink-2)}
.track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--sb);border-radius:3px}
.hist{font-size:13px;border-radius:12px;padding:10px 12px;background:#e8f0ff;color:#2457c5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hist{background:#1b2740;color:#8fb2ff}}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
.btn.pri{background:var(--sb);color:#fff}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn svg{width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="locked">

<div class="gate">
  <form id="gate-form" autocomplete="off">
    <img src="assets/sb_logo.png" alt="SB">
    <h1>SB 카트</h1>
    <p>접속 코드를 입력해 주세요.</p>
    <input id="gate-code" type="password" inputmode="numeric" placeholder="••••" aria-label="접속 코드" required>
    <label><input id="gate-remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button id="gate-btn" type="submit">들어가기</button>
    <div id="gate-msg" role="status"></div>
  </form>
</div>

<div class="app">
  <header class="top" id="top">
    <div class="top-in">
      <div class="bar">
        <img src="assets/sb_logo.png" alt="SB">
        <div class="t"><b>SB 카트</b><span id="sub">불러오는 중…</span></div>
        <div class="sp"></div>
        <button class="icon-btn" id="fav-btn" aria-pressed="false" aria-label="찜한 상품만 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.3 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>
          <span class="dot" id="fav-n" hidden>0</span>
        </button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="상품명 또는 상품번호" aria-label="검색">
        <select id="sort" aria-label="정렬">
          <option value="rate">할인율순</option>
          <option value="low">낮은 가격순</option>
          <option value="end">마감 임박순</option>
          <option value="video">영상 순서</option>
          <option value="buy">매입가 대비 절약순</option>
        </select>
      </label>
      <div class="views" id="views" role="group" aria-label="보기"><button data-view="now" aria-pressed="true">이번 주 행사</button><button data-view="wh" aria-pressed="false">창고</button><button data-view="all" aria-pressed="false">전체</button></div>
      <div class="cats" id="cats" role="group" aria-label="카테고리"></div>
    </div>
  </header>

  <main>
    <section id="pick-sec">
      <h2>SB PICK <small>할인율 높은 상품</small></h2>
      <div class="picks" id="picks"></div>
    </section>
    <h2 id="list-h">전체 상품 <small id="list-n"></small></h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>조건에 맞는 상품이 없어요.</div>
    <div class="sentinel" id="sentinel"></div>

    <div class="foot">
      <p>유리카트 유튜브의 최신 코스트코 행사 영상에서 가격표를 읽어 정리했어요. 가격은 매장과 시점에 따라 다를 수 있으니 구매·판매 전에 매장에서 확인해 주세요.</p>
      <p>영상 캡처는 쓰지 않았고, 상품 사진의 저작권은 코스트코 코리아에 있어요. 내부 참고용이니 외부로 공유하지 말아 주세요.</p>
      <button type="button" id="lock">이 기기에서 잠그기</button>
    </div>
  </main>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-name"></div>
<div class="toast" id="toast"></div>

<script>
// ================= 접속 코드 확인 + 복호화 =================
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(code) {
  const r = await fetch('data.enc.json', {cache: 'no-cache'});
  if (!r.ok) throw new Error('데이터를 불러오지 못했어요 (' + r.status + ')');
  const box = await r.json();

    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv)}, dk, unb64(box.ct));

}

          <div class="track"><i style="width:${(passed * 100).toFixed(0)}%"></i></div></div>` : (d.catalog ? '<div class="period">코스트코 온라인몰 판매가 · 유리카트 행사 기록 없음</div>' : `<div class="period">${md(d.video_date)} 영상${d.new_item ? ' · 신상(할인 없음)' : ''}</div>`)}
        ${buyBlock(d)}
        ${d.times > 1 ? `<div class="hist">유리카트 행사 ${d.times}회 기록. 지금까지 최저 행사가는 <b>${won(d.best)}원</b>${!d.new_item && d.sale <= d.best ? ' — 이 가격이 가장 싸요!' : ''}</div>` : ''}
        <div class="acts">
          <button class="btn ${S.favs.has(d.key) ? 'pri' : 'sec'}" id="s-fav">${ICON.heart} ${S.favs.has(d.key) ? '찜함' : '찜하기'}</button>
          ${d.video_url ? `<a class="btn sec" href="${esc(d.video_url)}" target="_blank" rel="noopener">${ICON.play} 영상에서 보기</a>` : ''}
          ${online ? `<a class="btn sec" href="https://www.costco.co.kr/p/${esc(d.item_no)}" target="_blank" rel="noopener">${ICON.bag} 온라인몰</a>` : ''}
        </div>
        ${d.needs_check ? '<div class="unit">상품번호 일부가 화면에서 가려져 확인이 필요해요.</div>' : ''}
      </div>
    </div>`;
  $('s-x').onclick = closeSheet;
  $('s-fav').onclick = () => { toggleFav(d.key); openSheet(d.key); };
  if ($('s-no')) $('s-no').onclick = () => { navigator.clipboard?.writeText(d.item_no).then(() => toast('상품번호를 복사했어요'), () => {}); };
  $('sheet').scrollTop = 0;
  $('sheet').classList.add('on'); $('sheet-bg').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function trendBlock(d) {
  const ser = (S.series.get(String(d.item_no)) || []).slice().sort((a, b) => (a.d < b.d ? -1 : 1));
  const buys = d.buy ? d.buy.hist.filter((x) => x.d) : [];
  const pts = [...ser.map((x) => x.d), ...buys.map((x) => x.d)];
  if (!pts.length) return '';
  const t = (s) => new Date(s + 'T00:00:00').getTime();
  let t0 = Math.min(...pts.map(t)), t1 = Math.max(...pts.map(t));
  if (t1 - t0 < 14 * 864e5) { const mid = (t0 + t1) / 2; t0 = mid - 7 * 864e5; t1 = mid + 7 * 864e5; }
  const vals = [...ser.map((x) => x.s).filter(Boolean), ...ser.map((x) => x.r).filter(Boolean), ...buys.map((x) => x.e)];
  let v0 = Math.min(...vals), v1 = Math.max(...vals);
  const pad = Math.max((v1 - v0) * 0.15, v1 * 0.05); v0 = Math.max(0, v0 - pad); v1 = v1 + pad;
  const W = 320, H = 150, L = 46, R = 10, T = 10, B = 22;
  const X = (s) => L + (t(s) - t0) / (t1 - t0) * (W - L - R);
  const Y = (v) => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
  const kfmt = (v) => v >= 10000 ? (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '만' : won(Math.round(v));
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = v0 + (v1 - v0) * i / 3, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${kfmt(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const dt = new Date(t0 + (t1 - t0) * i / 4); const s = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    g += `<text x="${X(s)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}" font-size="10" fill="var(--ink-3)">${md(s)}</text>`; }
  const path = (arr, key) => arr.filter((x) => x[key]).map((x, i) => (i ? 'L' : 'M') + X(x.d).toFixed(1) + ' ' + Y(x[key]).toFixed(1)).join(' ');
  if (ser.some((x) => x.r)) g += `<path d="${path(ser, 'r')}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 3"/>` + ser.filter((x) => x.r).map((x) => `<circle cx="${X(x.d)}" cy="${Y(x.r)}" r="3" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.5"><title>${md(x.d)} 정상가 ${won(x.r)}원</title></circle>`).join('');
  g += `<path d="${path(ser, 's')}" fill="none" stroke="var(--sb)" stroke-width="2.5" stroke-linejoin="round"/>` + ser.filter((x) => x.s).map((x) => `<circle cx="${X(x.d)}" cy="${Y(x.s)}" r="4.5" fill="var(--sb)" stroke="var(--surface)" stroke-width="2"><title>${md(x.d)} 행사가 ${won(x.s)}원</title></circle>`).join('');
  g += buys.map((x) => `<rect x="${X(x.d) - 4}" y="${Y(x.e) - 4}" width="8" height="8" rx="2" transform="rotate(45 ${X(x.d)} ${Y(x.e)})" fill="#2457c5" stroke="var(--surface)" stroke-width="1.5"><title>${md(x.d)} 우리 매입 ${won(x.e)}원 × ${won(x.q)}</title></rect>`).join('');
  const nS = ser.filter((x) => x.s).length;
  const note = ser.length < 2 ? '유리카트 영상이 업데이트될 때마다 행사가 점이 하나씩 늘어나요.' : `유리카트 영상 ${ser.length}회 등장 · 행사 ${nS}회`;
  return `<div class="trend"><h4>단가 변화 <small>${md(pts.slice().sort()[0])} ~ ${md(pts.slice().sort().pop())}</small></h4>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="단가 변화 그래프">${g}</svg>
    <div class="lg"><span><i style="background:var(--sb)"></i>유리카트 행사가</span>${ser.some((x) => x.r) ? '<span><i style="background:transparent;border:1.5px solid var(--ink-3)"></i>정상가</span>' : ''}${buys.length ? '<span><i style="background:#2457c5;border-radius:2px;transform:rotate(45deg)"></i>우리 매입가</span>' : ''}</div>
    <div class="note">${note}</div></div>`;
}
function buyBlock(d) {
  const b = d.buy; if (!b) return '';
  const cmp = d.unitWarn ? '<span class="tag warn">매입 단위(낱개/묶음)가 다를 수 있어요. 확인해 주세요.</span>'
    : d.vsBuy > 0 ? `<span class="cmp" style="color:#167a3e">지난 매입보다 ${won(d.vsBuy)}원 싸요</span>`
    : d.vsBuy < 0 ? `<span class="cmp" style="color:var(--ink-3)">지난 매입이 ${won(-d.vsBuy)}원 더 쌌어요</span>`
    : '<span class="cmp">지난 매입가와 같아요</span>';
  const rows = b.hist.slice().reverse().map((x) => `<tr><td>${md(x.d)}</td><td class="num">${won(x.u)}</td><td class="num">${x.e !== x.u ? won(x.e) : '—'}</td><td class="num">${won(x.q)}</td></tr>`).join('');
  return `<div class="buy"><h4>우리 매입 이력 <span class="tag">${b.count}회 · ${won(b.qty)}개</span></h4>
    <div class="kv num"><div><span>최근</span><b>${won(b.last_eff)}</b></div><div><span>평균</span><b>${won(b.avg_eff)}</b></div><div><span>최저</span><b>${won(b.min_eff)}</b></div></div>
    ${cmp}
    <table><thead><tr><th>날짜</th><th>단가</th><th>쿠폰 후</th><th>수량</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function closeSheet() { $('sheet').classList.remove('on'); $('sheet-bg').classList.remove('on'); document.body.style.overflow = ''; }
$('sheet-bg').addEventListener('click', closeSheet);
// 모바일: 시트를 아래로 끌어 닫기
(() => { let y0 = null; const sh = $('sheet');
  sh.addEventListener('touchstart', (e) => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener('touchend', (e) => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, {passive: true});
})();

let tT; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => el.classList.remove('on'), 1600); }

// ---------- 시작 ----------
(() => { const c = ls.get('sb-yc-code'); if (c) { $('gate-code').value = c; tryCode(c, true); } else $('gate-code').focus(); })();
</script>
</body>
